[build]
base = "."
command = "corepack pnpm --filter @workspace/web run build"
publish = "apps/web/dist"
functions = "apps/api/netlify/functions"

[build.environment]
NODE_VERSION = "24"
NODE_ENV = "production"

[functions]
node_bundler = "esbuild"
external_node_modules = ["argon2"]
included_files = [
  "apps/api/node_modules/argon2/**",
]

[functions.retention-sweep]
schedule = "@hourly"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
